services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ygt
      POSTGRES_PASSWORD: ygt
      POSTGRES_DB: ygt
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ygt"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Catches every email the app sends locally and shows it in a web UI at http://localhost:8025.
  # Without this, core/email.py finds no mail provider and logs the message instead of sending
  # it, so registration "works" but the verification code only ever appears in `docker logs` --
  # which looks exactly like registration being broken.
  #
  # Nothing leaves the machine: Mailpit accepts the SMTP conversation and keeps the message.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://ygt:ygt@db:5432/ygt
      # Point the app's SMTP path at Mailpit. Mailpit takes no credentials and no TLS, which is
      # why SMTP_USER/PASSWORD are absent and TLS is off -- see _send_via_smtp in core/email.py.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USE_TLS: "false"
      # Unset by default, so /docs/* is a 404 locally too. To try the partner deck locally:
      #   DOCS_PIN=<pin> docker compose up -d backend   (files go in backend/private_docs/)
      DOCS_PIN: ${DOCS_PIN:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* vars are baked into the Next.js bundle at build time (see Dockerfile),
      # not readable from a runtime `environment:` entry — this must be a build arg, or every
      # API call silently becomes a relative fetch against the frontend's own origin and 404s.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        # Server-side only: the /docs proxy runs inside this container, where localhost is itself.
        INTERNAL_API_URL: http://backend:8000/api/v1
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - backend
    # No source bind mount here on purpose — frontend/Dockerfile is a production multi-stage
    # build (next build -> standalone node server.js), shared with the Azure deploy image, not
    # a dev server. Mounting host source over /app replaces the built server.js with nothing
    # and crash-loops the container. After editing frontend code, rebuild and recreate:
    #   docker compose build frontend && docker compose up -d --force-recreate frontend

volumes:
  db_data:
