services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ygt
      POSTGRES_PASSWORD: ygt
      POSTGRES_DB: ygt
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ygt"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://ygt:ygt@db:5432/ygt
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* vars are baked into the Next.js bundle at build time (see Dockerfile),
      # not readable from a runtime `environment:` entry — this must be a build arg, or every
      # API call silently becomes a relative fetch against the frontend's own origin and 404s.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - backend
    # No source bind mount here on purpose — frontend/Dockerfile is a production multi-stage
    # build (next build -> standalone node server.js), shared with the Azure deploy image, not
    # a dev server. Mounting host source over /app replaces the built server.js with nothing
    # and crash-loops the container. After editing frontend code, rebuild and recreate:
    #   docker compose build frontend && docker compose up -d --force-recreate frontend

volumes:
  db_data:
