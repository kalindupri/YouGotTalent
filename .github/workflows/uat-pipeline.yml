# Runs on every push to uat: backend unit tests + Playwright E2E, then (only if both pass)
# deploys to UAT (rg-ygt-dev / test.yougottalent.lk), posts the change set + result to Discord,
# and polls for a human "Approved" reply before fast-forward-merging uat into main — which in
# turn triggers main-deploy.yml to push the same commit to production.
name: UAT Pipeline

on:
  push:
    branches: [uat]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  actions: write  # needed by merge-to-main's "Trigger production deploy" API dispatch call

env:
  RESOURCE_GROUP: rg-ygt-dev
  BACKEND_APP_NAME: ygt-backend
  FRONTEND_APP_NAME: ygt-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ygt
          POSTGRES_PASSWORD: ygt
          POSTGRES_DB: ygt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ygt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (used by test fixtures for media samples)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run backend test suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://ygt:ygt@localhost:5432/ygt
          SECRET_KEY: ci-test-secret-key
        run: python -m pytest -q

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Create .env for docker compose
        run: |
          cp .env.example .env
          # The E2E suite drives dozens of registrations/logins from this one runner IP in a
          # single run -- no real single user does that, so this is a CI-only bypass, not a
          # loosening of the real per-IP limit (see app/core/config.py:RATE_LIMITING_ENABLED).
          echo "RATE_LIMITING_ENABLED=false" >> .env
      - name: Start the full stack
        run: docker compose up -d --build
      - name: Wait for backend to be reachable
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v1/talents > /dev/null && exit 0
            sleep 5
          done
          echo "Backend never became healthy" && exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run E2E suite
        working-directory: e2e
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/report
          retention-days: 14

  deploy-uat:
    runs-on: ubuntu-latest
    needs: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ygt-backend:uat-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update UAT backend
        run: |
          az containerapp update --name ${{ env.BACKEND_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ghcr.io/${{ github.repository_owner }}/ygt-backend:uat-${{ github.sha }}

      - name: Get backend FQDN
        id: backend
        run: |
          FQDN=$(az containerapp show --name ${{ env.BACKEND_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          # uat- prefix keeps this distinct from main-deploy.yml's tag for the same commit --
          # they build the frontend with different NEXT_PUBLIC_API_URL values baked in, and a
          # shared tag meant whichever workflow pushed last silently overwrote the other's
          # image in the registry, breaking whichever environment pulled it next.
          tags: ghcr.io/${{ github.repository_owner }}/ygt-frontend:uat-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ steps.backend.outputs.fqdn }}/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update UAT frontend
        run: |
          az containerapp update --name ${{ env.FRONTEND_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ghcr.io/${{ github.repository_owner }}/ygt-frontend:uat-${{ github.sha }}

  request-approval:
    runs-on: ubuntu-latest
    needs: deploy-uat
    outputs:
      approved: ${{ steps.approval.outputs.approved }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build change set summary
        id: changes
        run: |
          {
            echo "summary<<EOF"
            git log --pretty="- %s (%h)" origin/main..HEAD
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post to Discord and poll for approval
        id: approval
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_DEPLOY_CHANNEL_ID: ${{ secrets.DISCORD_DEPLOY_CHANNEL_ID }}
          CHANGE_SET: ${{ steps.changes.outputs.summary }}
        run: python .github/scripts/request_deploy_approval.py

  merge-to-main:
    runs-on: ubuntu-latest
    needs: request-approval
    if: needs.request-approval.outputs.approved == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Fast-forward main to uat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge --ff-only origin/uat
          git push origin main

      - name: Trigger production deploy
        # A push made with the default GITHUB_TOKEN does not fire other workflows' `on: push`
        # triggers (GitHub's anti-loop protection) -- so main-deploy.yml would never actually
        # run on its own after the push above. Dispatch it explicitly instead.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/main-deploy.yml/dispatches" \
            -d '{"ref":"main"}'
