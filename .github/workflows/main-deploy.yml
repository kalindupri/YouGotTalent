# Deploys to production (rg-ygt-prod / yougottalent.lk). Only ever triggered by
# uat-pipeline.yml's automated merge after a human approves in Discord — this workflow itself
# does no testing or approval-gating, since that already happened before the commit reached
# main. A direct push to main (bypassing uat) will still deploy; branch protection on main
# should be enabled if that's not wanted.
name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  RESOURCE_GROUP: rg-ygt-prod
  BACKEND_APP_NAME: ygt-backend-prod
  FRONTEND_APP_NAME: ygt-frontend-prod
  DISCORD_API: https://discord.com/api/v10

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ygt-backend:prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update production backend
        run: |
          az containerapp update --name ${{ env.BACKEND_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ghcr.io/${{ github.repository_owner }}/ygt-backend:prod-${{ github.sha }}

      - name: Get backend FQDN
        id: backend
        run: |
          FQDN=$(az containerapp show --name ${{ env.BACKEND_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          # prod- prefix keeps this distinct from uat-pipeline.yml's tag for the same commit --
          # see the matching comment there for why a shared tag broke UAT.
          tags: ghcr.io/${{ github.repository_owner }}/ygt-frontend:prod-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ steps.backend.outputs.fqdn }}/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update production frontend
        run: |
          az containerapp update --name ${{ env.FRONTEND_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ghcr.io/${{ github.repository_owner }}/ygt-frontend:prod-${{ github.sha }}

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            curl -sf "https://${{ steps.backend.outputs.fqdn }}/api/v1/talents" > /dev/null && exit 0
            sleep 10
          done
          echo "Production backend never became healthy after deploy" && exit 1

      - name: Post confirmation to Discord
        if: always()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_DEPLOY_CHANNEL_ID: ${{ secrets.DISCORD_DEPLOY_CHANNEL_ID }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ Deployed \`${{ github.sha }}\` to production (yougottalent.lk)."
          else
            MSG="❌ Production deploy of \`${{ github.sha }}\` failed — check the Actions run."
          fi
          curl -sf -X POST "$DISCORD_API/channels/$DISCORD_DEPLOY_CHANNEL_ID/messages" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" -H "Content-Type: application/json" \
            -d "$(python3 -c 'import json,sys; print(json.dumps({"content": sys.argv[1]}))' "$MSG")"
