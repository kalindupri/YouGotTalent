# Manually flips a production maintenance page on/off, e.g. during a manual DB fix or an
# incident. Takes priority over the coming-soon page if both are ever left on. Takes effect
# within about a minute (new Container App revision), no rebuild needed -- see
# frontend/src/middleware.ts.
name: Toggle Maintenance Page

on:
  workflow_dispatch:
    inputs:
      state:
        description: "Turn maintenance mode on or off"
        required: true
        type: choice
        options:
          - "on"
          - "off"

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-ygt-prod
  FRONTEND_APP_NAME: ygt-frontend-prod

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set MAINTENANCE_MODE
        run: |
          if [ "${{ inputs.state }}" = "on" ]; then
            VALUE=true
          else
            VALUE=false
          fi
          az containerapp update --name ${{ env.FRONTEND_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} \
            --set-env-vars MAINTENANCE_MODE=$VALUE
          echo "### Maintenance mode is now **${{ inputs.state }}**" >> "$GITHUB_STEP_SUMMARY"
