# The UAT environment at test.yougottalent.lk, as a switch.
#
# WHY THIS FILE EXISTS. The UAT container apps used to be configured by hand in the Azure portal
# and the deploy job only ever swapped `--image`. So the environment's 21 environment variables
# lived nowhere but inside Azure, and deleting the two apps destroyed the lot. Everything needed
# to stand UAT back up is now declared here, in source control, so it cannot be lost that way
# again -- secrets excepted, which come from GitHub Actions secrets.
#
# THE SWITCH. UAT costs money only while its containers are running. `down` stops them and the
# database; `up` starts them again. A stopped Container App bills nothing and keeps its
# configuration, custom domain and TLS certificate, so the switch is cheap in both directions --
# unlike delete/recreate, which loses exactly what we lost before.
#
#   provision  create the apps (first run, or after a destroy). Idempotent: skips what exists.
#   up         start the apps and the database        -- UAT reachable, billing
#   down       stop the apps and the database         -- UAT dark, not billing
#   status     report what is running, and say nothing else
#   destroy    delete the apps entirely. The config survives here, so this is recoverable.
#
# TWO WAYS TO FLIP IT.
#   1. Actions -> UAT Environment -> Run workflow. GitHub only offers this button once the
#      workflow is on main.
#   2. Edit .github/uat-switch on the uat branch (the GitHub web editor is fine) so it contains
#      one of the words above, and commit. Works from uat alone, before anything reaches main --
#      and the UAT Pipeline ignores a commit that touches only that file, so flipping the switch
#      does not re-run the test suite or ask for a production approval.
#
# NOTE ON THE DATABASE. Azure automatically restarts a stopped PostgreSQL Flexible Server after
# 7 days. `down` is therefore not permanent for the database -- re-run it, or accept the cost of
# a B1ms burstable instance. The container apps have no such behaviour and stay down.
name: UAT Environment

on:
  push:
    branches: [uat]
    paths: ['.github/uat-switch']
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do with UAT'
        required: true
        type: choice
        options: [status, up, down, provision, destroy]

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-ygt-dev
  CONTAINER_ENV: ygt-env
  BACKEND_APP: ygt-backend
  FRONTEND_APP: ygt-frontend
  PG_SERVER: ygt-pg-dev-4821b
  UAT_HOST: test.yougottalent.lk

jobs:
  uat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve action
        id: act
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            action="${{ inputs.action }}"
          else
            action=$(tr -d '[:space:]' < .github/uat-switch)
          fi
          case "$action" in
            status|up|down|provision|destroy) ;;
            *) echo "::error::.github/uat-switch must contain one of: status up down provision destroy (got '$action')"; exit 1 ;;
          esac
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "Action: **$action**" >> "$GITHUB_STEP_SUMMARY"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Status
        run: |
          # containerapp and communication are CLI extensions; without this the runner stops at an
          # install prompt nobody can answer.
          az config set extension.use_dynamic_install=yes_without_prompt 2>/dev/null
          echo "### UAT status" >> "$GITHUB_STEP_SUMMARY"
          for app in "$BACKEND_APP" "$FRONTEND_APP"; do
            state=$(az containerapp show -n "$app" -g "$RESOURCE_GROUP" --query properties.runningStatus -o tsv 2>/dev/null || echo "not provisioned")
            echo "- **$app**: $state" >> "$GITHUB_STEP_SUMMARY"
          done
          pg=$(az postgres flexible-server show -n "$PG_SERVER" -g "$RESOURCE_GROUP" --query state -o tsv 2>/dev/null || echo unknown)
          echo "- **$PG_SERVER**: $pg" >> "$GITHUB_STEP_SUMMARY"

      # --- provision --------------------------------------------------------------------------
      # Only the pieces that do not exist. Re-running is safe and is the intended way to apply a
      # change to the environment variables below.
      - name: Provision
        if: steps.act.outputs.action == 'provision'
        env:
          # Secrets. Set these once in the repository's Actions secrets. UAT_DATABASE_URL is the
          # only one without a workable default -- the database password is not recoverable from
          # Azure, so reset it (`az postgres flexible-server update --admin-password`) and store
          # the resulting URL here.
          UAT_DATABASE_URL: ${{ secrets.UAT_DATABASE_URL }}
          UAT_SECRET_KEY: ${{ secrets.UAT_SECRET_KEY }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          # NOT secrets.GITHUB_TOKEN. The ygt-* packages are private, and Azure stores this
          # credential to pull images on every scale-up from zero -- GITHUB_TOKEN expires when this
          # job ends, so the first cold start after provisioning would fail to pull. This must be
          # a long-lived personal access token with read:packages, as production uses.
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$UAT_DATABASE_URL" ]; then
            echo "::error::UAT_DATABASE_URL is not set. Reset the Postgres admin password and add the connection URL as a repository secret."
            exit 1
          fi
          if [ -z "$GHCR_TOKEN" ]; then
            echo "::error::GHCR_PULL_TOKEN is not set. Add a GitHub personal access token with read:packages as a repository secret."
            exit 1
          fi
          STORAGE_CONN=$(az storage account show-connection-string -n ygtdevstorage4821 -g "$RESOURCE_GROUP" --query connectionString -o tsv)
          COMMS_CONN=$(az communication list-key --name ygt-comms -g "$RESOURCE_GROUP" --query primaryConnectionString -o tsv)
          SECRET_KEY="${UAT_SECRET_KEY:-$(openssl rand -base64 48 | tr -d '\n')}"

          # Guardian-consent documents (birth certificates) go here, never in the public
          # talent-media container, so it must not be publicly readable.
          az storage container create --name identity-documents --connection-string "$STORAGE_CONN" --public-access off >/dev/null

          if ! az containerapp show -n "$BACKEND_APP" -g "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Creating $BACKEND_APP"
            az containerapp create \
              --name "$BACKEND_APP" --resource-group "$RESOURCE_GROUP" --environment "$CONTAINER_ENV" \
              --image "mcr.microsoft.com/k8se/quickstart:latest" \
              --target-port 8000 --ingress external \
              --cpu 0.5 --memory 1Gi --min-replicas 0 --max-replicas 2 \
              --registry-server ghcr.io --registry-username "$GHCR_USERNAME" --registry-password "$GHCR_TOKEN" \
              --secrets "database-url=$UAT_DATABASE_URL" "app-secret-key=$SECRET_KEY" \
                        "storage-conn-str=$STORAGE_CONN" "comms-conn-str=$COMMS_CONN"
          fi

          BACKEND_FQDN=$(az containerapp show -n "$BACKEND_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)

          # UAT deliberately runs the mock payment gateway and no SMTP: a test environment must
          # never be able to take a real payment, and unset SMTP makes core/email.py log the
          # message rather than send it, so test signups cannot email real people.
          az containerapp update -n "$BACKEND_APP" -g "$RESOURCE_GROUP" \
            --set-env-vars \
              "DATABASE_URL=secretref:database-url" \
              "SECRET_KEY=secretref:app-secret-key" \
              "AZURE_STORAGE_CONNECTION_STRING=secretref:storage-conn-str" \
              "AZURE_COMMUNICATION_CONNECTION_STRING=secretref:comms-conn-str" \
              "PAYMENT_GATEWAY=mock" \
              "EMAIL_FROM=no-reply@yougottalent.lk" \
              "FRONTEND_URL=https://$UAT_HOST" \
              "BACKEND_PUBLIC_URL=https://$BACKEND_FQDN" \
              "CORS_ORIGINS=[\"https://$UAT_HOST\",\"https://$BACKEND_FQDN\"]"

          if ! az containerapp show -n "$FRONTEND_APP" -g "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Creating $FRONTEND_APP"
            az containerapp create \
              --name "$FRONTEND_APP" --resource-group "$RESOURCE_GROUP" --environment "$CONTAINER_ENV" \
              --image "mcr.microsoft.com/k8se/quickstart:latest" \
              --target-port 3000 --ingress external \
              --cpu 0.5 --memory 1Gi --min-replicas 0 --max-replicas 2 \
              --registry-server ghcr.io --registry-username "$GHCR_USERNAME" --registry-password "$GHCR_TOKEN"
          fi

          FRONTEND_FQDN=$(az containerapp show -n "$FRONTEND_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)

          # Re-applied on every run, not just at creation, so rotating the token is "update the
          # secret, re-run provision".
          for app in "$BACKEND_APP" "$FRONTEND_APP"; do
            az containerapp registry set -n "$app" -g "$RESOURCE_GROUP" \
              --server ghcr.io --username "$GHCR_USERNAME" --password "$GHCR_TOKEN" >/dev/null
          done

          # DNS is created here rather than kept permanently, and deliberately AFTER the app
          # exists. A CNAME pointing at a deleted Container App hostname is a subdomain-takeover
          # risk -- anyone who later claims that name in Azure serves content on our domain. So
          # `destroy` removes these records and `provision` puts them back.
          VERIFICATION_ID=$(az containerapp env show -n "$CONTAINER_ENV" -g "$RESOURCE_GROUP" --query properties.customDomainConfiguration.customDomainVerificationId -o tsv)
          az network dns record-set cname set-record -g "$RESOURCE_GROUP" -z yougottalent.lk             -n test --cname "$FRONTEND_FQDN" --ttl 3600
          az network dns record-set txt add-record -g "$RESOURCE_GROUP" -z yougottalent.lk             -n asuid.test --value "$VERIFICATION_ID" 2>/dev/null || true

          # Azure will not issue the certificate until the records resolve.
          echo "Waiting for DNS to propagate before binding the certificate..."
          for i in $(seq 1 20); do
            if getent hosts "$UAT_HOST" >/dev/null 2>&1; then break; fi
            sleep 15
          done
          az containerapp hostname add -n "$FRONTEND_APP" -g "$RESOURCE_GROUP" --hostname "$UAT_HOST" 2>/dev/null || echo "hostname already added"
          az containerapp hostname bind -n "$FRONTEND_APP" -g "$RESOURCE_GROUP" --hostname "$UAT_HOST"             --environment "$CONTAINER_ENV" --validation-method CNAME 2>/dev/null || echo "::warning::certificate binding did not complete -- re-run provision once DNS has propagated"

          echo "Backend : https://$BACKEND_FQDN"  >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend: https://$FRONTEND_FQDN" >> "$GITHUB_STEP_SUMMARY"
          echo "Custom  : https://$UAT_HOST" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The apps are running a placeholder image. Push to \`uat\` (or re-run the UAT Pipeline) to deploy the real ones." >> "$GITHUB_STEP_SUMMARY"

      # --- the switch -------------------------------------------------------------------------
      - name: Up
        if: steps.act.outputs.action == 'up'
        run: |
          az postgres flexible-server start -n "$PG_SERVER" -g "$RESOURCE_GROUP" 2>/dev/null || echo "database already running"
          for app in "$BACKEND_APP" "$FRONTEND_APP"; do
            az containerapp start -n "$app" -g "$RESOURCE_GROUP" || echo "::warning::could not start $app -- provision it first?"
          done
          echo "UAT is up: https://$UAT_HOST" >> "$GITHUB_STEP_SUMMARY"

      - name: Down
        if: steps.act.outputs.action == 'down'
        run: |
          for app in "$BACKEND_APP" "$FRONTEND_APP"; do
            az containerapp stop -n "$app" -g "$RESOURCE_GROUP" || echo "::warning::could not stop $app"
          done
          az postgres flexible-server stop -n "$PG_SERVER" -g "$RESOURCE_GROUP" || echo "database already stopped"
          echo "UAT is down and not billing." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Azure restarts a stopped PostgreSQL Flexible Server after 7 days -- re-run \`down\` if UAT stays unused." >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy
        if: steps.act.outputs.action == 'destroy'
        run: |
          for app in "$BACKEND_APP" "$FRONTEND_APP"; do
            az containerapp delete -n "$app" -g "$RESOURCE_GROUP" --yes || true
          done
          # Remove the records with the app: a CNAME left pointing at a deleted Container App
          # hostname can be claimed by someone else and served on our domain.
          az network dns record-set cname delete -g "$RESOURCE_GROUP" -z yougottalent.lk -n test --yes 2>/dev/null || true
          az network dns record-set txt delete -g "$RESOURCE_GROUP" -z yougottalent.lk -n asuid.test --yes 2>/dev/null || true
          echo "UAT apps deleted. Everything needed to rebuild them is in this workflow -- run \`provision\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deliberately left alone: the DNS zone, ygt-email/ygt-comms and the database. The zone carries www -> production and the DKIM records for all outbound mail, so deleting rg-ygt-dev would take production down." >> "$GITHUB_STEP_SUMMARY"
